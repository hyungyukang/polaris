# Options for the analysis_members tasks on the EC30to60E2r2 mesh
[analysis_members]

# The baroclinic and barotropic time steps
dt = 00:30:00
btr_dt = 00:01:00

# The length of the short run.  The 1_year run is always 365 days.
short_run_duration = 0001_00:00:00

# The number of latitude bins of the 1_year run's MOC: Omega's default
moc_num_bins = 180

# Scale the viscosities with cell width
mesh_scaling = True

# The harmonic momentum viscosity (m^2/s) at the median cell width (35.92 km)
mom_del2 = 1197.0

# The biharmonic momentum viscosity (m^4/s) at the median cell width
mom_del4 = 2.06e11

# MPAS-Ocean's viscosities (E3SM's values), relative to the finest cells
mpas_ocean_mom_del2 = 1.0e3
mpas_ocean_mom_del4 = 1.2e11
